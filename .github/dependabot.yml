# Weekly dependency update PRs. Security fixes are opened as soon as an alert
# has a patched version (Settings → Code security → Dependabot security
# updates) and use the same labels.
#
# Every PR into main needs a version label (see pr-labels.yml); dependency
# bumps don't change what the site does, so they default to patch.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: ["patch"]
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
    groups:
      # One PR for everything that shouldn't break; majors get their own.
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: ["patch"]
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]
