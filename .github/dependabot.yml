# Weekly dependency update PRs. Security fixes are opened as soon as an alert
# has a patched version (Settings → Code security → Dependabot security
# updates).
#
# Every PR into main needs a version label (see pr-labels.yml). Dependabot
# adds the repo's major/minor/patch label matching the size of the update
# itself, so no version label is set here (it would be added on top of it).
# Swap the label before merging if the site's version should bump
# differently. "dependencies" is added alongside it; pr-labels.yml ignores it.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
    groups:
      # One PR for everything that shouldn't break; majors get their own.
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]
