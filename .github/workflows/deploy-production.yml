# Publishes a version tag to https://mgnajarian.com/, keeping whatever preview
# is live. Run it with an older version to roll back.
name: Deploy production

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version tag to deploy (e.g. v1.2.3), or "latest"
        type: string
        default: latest

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve version
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          tags=$(gh api "repos/$REPO/git/matching-refs/tags/v" --paginate --jq '.[].ref | ltrimstr("refs/tags/")' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V)
          if [ "$VERSION" = "latest" ]; then
            tag=$(tail -n1 <<<"$tags")
          elif grep -qxF "$VERSION" <<<"$tags"; then
            tag=$VERSION
          else
            echo "::error::$VERSION is not a version tag. Available: $(tr '\n' ' ' <<<"$tags")"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Deploying $tag to production" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: resolve
    uses: ./.github/workflows/deploy-pages.yml
    with:
      production-ref: ${{ needs.resolve.outputs.tag }}
