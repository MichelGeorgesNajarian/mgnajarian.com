# Builds the Next.js site as a static export and deploys it to GitHub Pages.
#
# GitHub Pages serves a single site per repo and every deploy replaces it, so
# both branches are built and published together on every push to either:
#   master  -> https://mgnajarian.com/          (production)
#   develop -> https://mgnajarian.com/develop/  (preview, noindex)
#
# Lint, typecheck and build are checked on every PR by ci.yml.
name: Deploy Next.js site to Pages

on:
  push:
    branches: ["master", "develop"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the
# in-progress run and the latest queued. Don't cancel in-progress deployments.
concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  HUSKY: "0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          path: master
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          path: develop
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: develop/.nvmrc
          cache: npm
          cache-dependency-path: "*/package-lock.json"
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build develop (served from /develop)
        working-directory: develop
        env:
          BASE_PATH: /develop
        run: |
          npm ci
          npm run build

      # master may still be the old plain-HTML site; publish it as-is until the
      # Next.js site lands there.
      - name: Build master (served from /)
        run: |
          if [ -f master/package.json ]; then
            cd master
            npm ci
            npm run build
          else
            mkdir -p master/out
            rsync -a --exclude='.git' --exclude='.github' --exclude='out' master/ master/out/
          fi

      - name: Assemble site
        run: |
          mkdir -p site/develop
          cp -a master/out/. site/
          cp -a develop/out/. site/develop/
          # CNAME only belongs at the root; _next/ must not be processed by Jekyll.
          rm -f site/develop/CNAME site/develop/.nojekyll
          touch site/.nojekyll
          test -f site/index.html
          test -f site/develop/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
